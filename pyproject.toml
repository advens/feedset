[project]
name = "feedset"
version = "0.1.0"
description = "Build the feed directory an enricher and a Sigma matcher read."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jérémie Jourdin", email = "jeremie.jourdin@advens.fr" }]

[project.scripts]
feedset = "feedset.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
